name: Vérification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Un push qui en suit un autre de près annule la vérification en cours : c'est le
# sommet qui compte, pas les états intermédiaires.
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    # Les crons de ce dépôt committent avec [skip ci] dans le message, mais GitHub
    # n'honore cette convention que pour certains évènements. On la refait à la main :
    # la veille quotidienne ne touche que la file de propositions, qu'aucune page ne
    # rend — rejouer 1600 pages pour ça n'apporte rien.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Chaque étape est séparée pour que l'onglet Actions dise laquelle a lâché,
      # au lieu d'un `npm run verifier` monolithique dont il faut lire la sortie.
      - name: Valider le corpus
        run: npm run valider

      # Les workflows embarquent du shell et du JavaScript passé à `node -e`, avec
      # deux niveaux d'échappement — celui du YAML et celui des guillemets du shell.
      # Rien ne les vérifiait. Une faute dans le cron du lundi se découvrait le lundi
      # suivant ; celui-ci la trouve au push, en moins d'une seconde.
      - name: Contrôler la syntaxe des workflows
        run: npm run verifier-workflows

      - name: Contrôler les types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Le corpus et l'index qui le sert sont deux fichiers versionnés séparément, et
      # rien ne les liait : le 10/09/2026 l'index portait 2 855 passages pour un corpus
      # de 4 011 — 29 % du référentiel, dont les 300 fiches de sociologie, psychologie
      # et géopolitique, étaient invisibles au moteur de réponse. Aucune erreur, aucune
      # page cassée : seulement des réponses qui ne citaient jamais un tiers du corpus.
      # Ce contrôle interdit à cet écart de se reformer en silence.
      # `auditer-corpus.mjs` relève 34 règles de fond et sort en code 0 quel que soit le
      # résultat : il informait sans protéger, et n'était planifié nulle part. Le
      # cliquet en fait un garde-fou — le corpus peut s'améliorer librement, il ne peut
      # plus empirer par accident. Un plafond se relève par `npm run cliquet -- --figer`,
      # geste délibéré qui laisse une trace dans un commit.
      # Le §10 du mégaprompt exige « un changelog public de toute évolution ». Le
      # changelog s'était arrêté au 07/09/2026 pendant que le corpus passait de 514 à
      # 828 fiches : il a plus que doublé sans laisser de trace, et rien ne l'a
      # signalé — le seul script qui y écrivait était `appliquer-patchs.mjs`, qui
      # n'avait pas tourné. Ce contrôle rend l'omission impossible.
      - name: Le corpus ne grandit pas sans trace
        run: npm run verifier-changelog

      - name: Cliquet de qualité du corpus
        run: npm run cliquet

      - name: Vérifier que l'index couvre le corpus
        run: npm run verifier-index

      - name: Build
        run: npm run build

      # Le déploiement Vercel se déclenche sur le push, en parallèle de ce job : ce
      # résumé sert de trace lisible quand on remonte l'historique des Actions.
      - name: Résumé
        if: always()
        run: |
          COMPTE=$(node -e "
            const fs = require('fs');
            const dossier = 'data/seed/fiches_humaines';
            let humaines = 0;
            for (const f of fs.readdirSync(dossier)) {
              if (f.endsWith('.json')) humaines += JSON.parse(fs.readFileSync(dossier + '/' + f, 'utf8')).length;
            }
            const ia = JSON.parse(fs.readFileSync('data/seed/fiches_ia.json', 'utf8')).length;
            const gaps = JSON.parse(fs.readFileSync('data/seed/fiches_gap.json', 'utf8')).length;
            console.log(humaines + ' humaines, ' + ia + ' IA, ' + gaps + ' gaps');
          ")
          {
            echo "### Vérification — ${{ job.status }}"
            echo
            echo "Commit : \`${{ github.sha }}\`"
            echo
            echo "Corpus : $COMPTE"
            echo
            echo "Déploiement : https://vercel.com/dyonysos/atlas-humain-ia"
          } >> "$GITHUB_STEP_SUMMARY"
