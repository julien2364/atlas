name: Veille RSS quotidienne

on:
  schedule:
    # 07h00 UTC chaque jour (cf. docs/comment-lancer.md — anciennement un scheduled task lié au device, remplacé par ce cron GitHub natif qui ne dépend d'aucun ordinateur).
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances
        run: npm ci

      # Depuis le 07/09/2026, ce script sort en code 1 si AUCUN flux n'est joignable
      # alors que des flux actifs sont déclarés : une file inchangée parce que rien de
      # neuf n'a été publié est normale, une file inchangée parce que le réseau est
      # tombé ne l'est pas, et les deux se ressemblaient jusqu'ici. Pas de
      # continue-on-error : on veut que le cron rougisse.
      #
      # Le score de fiabilité de chaque proposition est calculé sur le domaine de son
      # url et non plus sur le nom du flux (cf. l'en-tête du script). Conséquence pour
      # ce job : les items arrivant par les flux Google News tombent au score plancher
      # et sont marqués `domaine_opaque` — ils ne peuvent plus franchir le seuil de
      # source primaire de l'étape de proposition ci-dessous.
      - name: Lancer la veille RSS
        run: node scripts/veille-rss.mjs

      - name: Committer les nouvelles propositions (s'il y en a)
        run: |
          git config user.name "atlas-veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          if git diff --quiet -- data/seed/veille_queue.json data/seed/veille_sources.json; then
            echo "Aucun changement — rien à committer."
          else
            git add data/seed/veille_queue.json data/seed/veille_sources.json
            git commit -m "chore(veille): mise à jour automatique de la file de validation [skip ci]"
            git push
          fi

      # ---------------------------------------------------------------------
      # Pré-tri (docs/decisions-ouvertes-2026-09-07.md, point 1, option C).
      # La collecte dépose une trentaine de propositions par jour, le tri est
      # humain : sans cette étape l'écart se creuse tout seul — la file est passée
      # de 136 à 238 entrées en attente entre le 7 et le 10 septembre 2026, sans
      # qu'aucune décision n'ait été prise.
      #
      # Le script n'ÉCARTE que sur des critères mécaniques — agrégateur masquant
      # l'éditeur, URL absente, doublon dans la file, URL déjà citée par une fiche.
      # Il n'accepte jamais rien. Écarter ne touche pas au corpus, accepter si :
      # c'est pourquoi cette moitié-là peut tourner sans humain et pas l'autre.
      # ---------------------------------------------------------------------
      - name: Pré-trier la file (écarte les cas mécaniques, n'accepte rien)
        run: node scripts/pretrier-veille.mjs --appliquer

      - name: Re-valider le corpus après pré-tri
        run: node scripts/valider-donnees.mjs

      # On indexe puis on laisse `git diff --cached` décider : tester l'arbre de
      # travail avant d'indexer ratait le cas du rapport, et un nom de rapport daté
      # rendait la condition toujours vraie. Le rapport porte un nom fixe et n'est
      # commité que si son contenu a changé.
      - name: Committer le pré-tri (s'il y a lieu)
        run: |
          git config user.name "atlas-veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data/seed/veille_queue.json docs/veille-pretri.md
          if git diff --cached --quiet; then
            echo "Rien de neuf — aucun écartement et rapport inchangé."
          else
            git commit -m "chore(veille): pré-tri automatique de la file [skip ci]"
            git push
          fi

      # ---------------------------------------------------------------------
      # Boucle de veille, étape « proposition » (MP-7).
      # Le cron va jusqu'à préparer le travail éditorial : il traduit les
      # propositions déjà qualifiées de la file en patchs de fiche relisibles,
      # et les publie comme artefact du job. Le fichier est écrit dans
      # RUNNER_TEMP, HORS du dépôt : ce job ne peut structurellement pas
      # modifier une fiche ni salir l'arbre de travail.
      #
      # L'application, elle, n'est JAMAIS automatisée : elle passe par
      # `node scripts/appliquer-patchs.mjs` lancé à la main, après relecture de
      # l'artefact. Aucune fiche n'est modifiée sans validation humaine.
      # ---------------------------------------------------------------------
      - name: Préparer les patchs de fiche (proposition seule, aucune écriture dans data/seed)
        run: |
          node scripts/appliquer-veille.mjs \
            --statut=a_traiter_fiche_existante \
            --sortie="${RUNNER_TEMP}/patchs-veille-${GITHUB_RUN_ID}.json"

      # Garde-fou explicite : si l'étape précédente avait touché une fiche, on
      # veut que le job échoue bruyamment plutôt que de laisser passer une
      # modification non validée.
      # `git status --porcelain` et non `git diff` : `git diff` ne voit que les
      # fichiers SUIVIS. Un script qui déposerait un fichier neuf dans data/seed/ —
      # une file de patchs, un fichier temporaire — passerait donc inaperçu alors
      # qu'il salit le corpus. Le contrôle porte sur l'arbre de travail entier :
      # après l'étape de proposition, il ne doit strictement rien y avoir de nouveau
      # ni de modifié, puisque le fichier produit est écrit dans RUNNER_TEMP.
      - name: Vérifier qu'aucune fiche n'a été modifiée
        run: |
          etat="$(git status --porcelain)"
          if [ -z "$etat" ]; then
            echo "OK — arbre de travail intact : l'étape de proposition n'a rien écrit dans le dépôt."
          else
            echo "ERREUR : l'étape de proposition a modifié ou créé des fichiers dans le dépôt."
            echo "Elle ne doit écrire QUE dans RUNNER_TEMP — aucune fiche ne se modifie sans relecture humaine."
            echo "$etat"
            exit 1
          fi

      # Le job était vert et muet : « 0 au statut a_traiter_fiche_existante, 0 traitée »,
      # artefact vide, code 0 — tous les jours depuis la création du cron. La cause est
      # structurelle et il faut la dire, pas la masquer : les deux producteurs
      # (veille-rss, documentation-recherche) n'écrivent que `en_attente`, et rien
      # d'automatique ne pose `a_traiter_fiche_existante`. La chaîne s'arrête donc ici
      # tant qu'un humain n'a pas désigné la fiche visée par une proposition.
      #
      # Une tentative de ciblage automatique par recouvrement lexical a été faite le
      # 10/09/2026 et abandonnée : sur les 197 propositions en attente, les meilleurs
      # rattachements étaient du bruit. La raison est en amont — 119 des 197 sont en
      # anglais face à un corpus français, et l'essentiel porte sur la conjoncture,
      # que le référentiel ne documente pas. Voir `npm run rendement-veille`.
      - name: Dire ce que l'étape de patchs a réellement produit
        if: always()
        run: |
          FICHIER="${RUNNER_TEMP}/patchs-veille-${GITHUB_RUN_ID}.json"
          NB=$(node -e "
            const fs = require('fs');
            try {
              const p = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
              console.log(Array.isArray(p) ? p.length : (p.patchs ?? []).length);
            } catch { console.log(0); }
          " "$FICHIER")
          ATTENTE=$(node -e "
            const q = require('./data/seed/veille_queue.json');
            console.log(q.filter((e) => e.statut === 'en_attente').length);
          ")
          {
            echo "### Boucle de veille"
            echo
            echo "Patchs proposés : **$NB**"
            echo
            echo "Propositions en attente de tri humain : **$ATTENTE**"
            if [ "$NB" -eq 0 ] && [ "$ATTENTE" -gt 0 ]; then
              echo
              echo "> Aucun patch, et ce n'est pas une panne : aucune proposition ne porte de fiche cible."
              echo "> Les producteurs n'écrivent que \\`en_attente\\` ; seul un tri humain pose"
              echo "> \\`a_traiter_fiche_existante\\`. La chaîne reprend au premier ciblage."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Patchs : $NB — en attente : $ATTENTE"

      - name: Publier les patchs proposés comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: patchs-veille-${{ github.run_id }}
          path: ${{ runner.temp }}/patchs-veille-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 30
