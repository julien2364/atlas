name: Contrôle qualité hebdomadaire du corpus

on:
  schedule:
    # Lundi 06h00 UTC — avant la veille quotidienne (07h00), pour que la semaine
    # démarre sur un corpus validé et sur des fiches périmées déjà signalées.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      seuil:
        description: "Ancienneté en jours au-delà de laquelle une fiche repasse en « à ré-auditer »"
        required: false
        default: "180"
      dry_run:
        description: "Simulation seule (true) — n'écrit rien"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances
        run: npm ci

      # Garde-fou : si le corpus est déjà cassé, on s'arrête AVANT toute écriture.
      # Le validateur sort en code 1 — pas de continue-on-error ici, c'est voulu.
      - name: Valider l'intégrité du corpus (avant audit)
        run: node scripts/valider-donnees.mjs

      - name: Auditer la fraîcheur des fiches
        run: |
          node scripts/audit-fraicheur.mjs \
            --seuil=${{ github.event.inputs.seuil || '180' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # Deuxième passage : on ne committe jamais un corpus cassé par l'audit.
      - name: Re-valider l'intégrité du corpus (après audit)
        run: node scripts/valider-donnees.mjs

      # Le budget IA, exigé par les §11.5 et §13.5 et « retenu tel quel » à l'arbitrage :
      # rien n'existait, ni compteur, ni plafond, ni alerte. Le script projette le coût
      # mensuel à partir du contexte réellement envoyé et du barème, et ne fait échouer
      # que si une clé de fournisseur est posée — une alarme qui sonne sans dépense est
      # une fausse alarme, et une fausse alarme hebdomadaire détruit l'alarme utile.
      - name: Budget IA — projection et seuil
        if: always()
        run: node scripts/budget-ia.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      # La couverture des attentes du mégaprompt. C'est la mesure qui manquait le plus :
      # après six lots de production, une quinzaine d'exigences explicites des sections
      # 3 et 4 n'étaient mentionnées dans aucun document du projet — Gemini, Mistral et
      # Qwen nommément demandés, trois des six limites transversales, AlphaGenome, le
      # classement des philosophes par courant. Personne ne les avait oubliées par
      # négligence : rien ne les rappelait. Ceci les rappelle, chaque lundi.
      - name: Couverture des attentes du mégaprompt
        if: always()
        run: |
          node scripts/detecter-lacunes.mjs --json > "${RUNNER_TEMP}/lacunes.json"
          node -e "
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/lacunes.json', 'utf8'));
            const l = ['### Couverture des attentes du mégaprompt', ''];
            l.push('**' + (100 * r.couverture).toFixed(1) + ' %** sur ' + r.total + ' items — couverts ' + r.compte.couvert + ', effleurés ' + r.compte.effleure + ', absents ' + r.compte.absent + '.');
            const aCombler = r.resultats.filter((x) => x.etat === 'absent' || x.etat === 'effleure');
            if (aCombler.length > 0) {
              l.push('');
              l.push('| section | item | état | requête d enquête |');
              l.push('|---|---|---|---|');
              for (const x of aCombler) l.push('| ' + x.section + ' | ' + x.nom + ' | ' + x.etat + ' | ' + (x.requete || '—') + ' |');
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, l.join('\n') + '\n');
            console.log('couverture ' + (100 * r.couverture).toFixed(1) + ' % — ' + aCombler.length + ' item(s) à combler');
          "

      # L'audit de fond, hors ligne et en moins d'une seconde, dans le résumé du job :
      # la CI garde le cliquet, celui-ci donne la photo complète, catégorie par
      # catégorie, à qui vient regarder l'état du corpus une fois par semaine.
      - name: Audit de fond du corpus
        if: always()
        run: |
          node scripts/auditer-corpus.mjs --json > "${RUNNER_TEMP}/audit.json"
          node -e "
            const fs = require('fs');
            const a = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/audit.json', 'utf8'));
            const g = a.resume_gravite;
            const l = ['### Audit de fond du corpus', ''];
            l.push(a.statistiques.fiches.total + ' fiches — bloquants **' + g.bloquant + '**, sérieux **' + g.serieux + '**, mineurs **' + g.mineur + '**');
            l.push('');
            l.push('| règle | gravité | total |'); l.push('|---|---|---:|');
            for (const c of a.constats.filter((c) => c.total > 0).sort((x, y) => y.total - x.total)) {
              l.push('| \\`' + c.code + '\\` | ' + c.gravite + ' | ' + c.total + ' |');
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, l.join('\n') + '\n');
            console.log('bloquants ' + g.bloquant + ' — sérieux ' + g.serieux + ' — mineurs ' + g.mineur);
          "

      # Le référentiel cite plus d'un millier d'URL, et sa crédibilité tient à ce
      # qu'elles mènent quelque part. `verifier-liens.mjs` existait depuis le début et
      # n'avait jamais été planifié : la pourriture des liens est lente, silencieuse et
      # continue — exactement ce qu'un contrôle hebdomadaire attrape et qu'une
      # relecture humaine ne voit jamais.
      #
      # `continue-on-error` est délibéré, et c'est le seul endroit du dépôt où il l'est :
      # un site tiers momentanément indisponible ne doit pas faire échouer l'audit de
      # fraîcheur ni bloquer le commit qui suit. Le rapport est publié comme artefact.
      - name: Vérifier les liens du corpus
        continue-on-error: true
        run: |
          node scripts/verifier-liens.mjs --json > "${RUNNER_TEMP}/liens.json" || true
          node -e "
            const fs = require('fs');
            let r;
            try { r = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/liens.json', 'utf8')); }
            catch { console.log('Rapport illisible — le contrôle n a pas abouti.'); process.exit(0); }
            const defauts = (r.resultats ?? []).filter((x) => x.etat === 'morte' || x.etat === 'invalide');
            console.log(r.urls_testees + ' URL testées — ' + defauts.length + ' en défaut');
            const l = ['### Liens du corpus', ''];
            l.push(r.urls_testees + ' URL distinctes testées sur ' + r.total_occurrences + ' occurrences.');
            l.push('');
            l.push('| état | nombre |'); l.push('|---|---:|');
            for (const [etat, n] of Object.entries(r.repartition ?? {})) if (n > 0) l.push('| ' + etat + ' | ' + n + ' |');
            if (defauts.length > 0) {
              l.push(''); l.push('#### À reprendre');
              for (const d of defauts.slice(0, 40)) {
                const ou = (d.occurrences ?? []).slice(0, 2).map((o) => o.fiche_id ?? o.id ?? '?').join(', ');
                l.push('- \\`' + d.url + '\\` — ' + d.etat + (ou ? ' — ' + ou : ''));
              }
              if (defauts.length > 40) l.push('', '… et ' + (defauts.length - 40) + ' autre(s), voir l artefact.');
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, l.join('\n') + '\n');
          "

      - name: Publier le rapport de liens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liens-corpus-${{ github.run_id }}
          path: ${{ runner.temp }}/liens.json
          if-no-files-found: warn
          retention-days: 30

      # Mesure hebdomadaire du rendement de la veille, source par source. Elle
      # n'existait pas : 425 propositions avaient été collectées et 6 avaient abouti
      # — 1,4 % — sans que personne puisse le voir. Une source qui répond n'est pas
      # une source qui nourrit ; ce contrôle-ci mesure la seconde propriété.
      # Il n'écrit rien et ne fait pas échouer le job : désactiver une source est une
      # décision de portée éditoriale.
      - name: Mesurer le rendement de la veille
        if: always()
        run: |
          node scripts/rendement-veille.mjs | tee /tmp/rendement.txt
          {
            echo "### Rendement de la veille"
            echo
            echo '```'
            cat /tmp/rendement.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Committer les fiches basculées (s'il y en a)
        run: |
          git config user.name "atlas-qualite-bot"
          git config user.email "qualite-bot@users.noreply.github.com"
          if git diff --quiet -- data/seed; then
            echo "Aucun changement — rien à committer."
          else
            git add data/seed
            git commit -m "chore(qualite): fiches basculées en ré-audit [skip ci]"
            git push
          fi
